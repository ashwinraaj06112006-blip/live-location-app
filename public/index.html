<!DOCTYPE html>
<!--hello-->
<!--hi-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Live Location Share</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>

<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #0f172a;
    --card-bg: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

  #lobby-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e3a8a); padding: 20px;
  }
  .lobby-card {
    background: var(--card-bg); width: 100%; max-width: 380px; border-radius: 16px;
    padding: 32px 28px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }
  .lobby-card h1 { margin: 0 0 6px; font-size: 22px; color: var(--text); text-align: center; }
  .lobby-card p.subtitle { margin: 0 0 24px; text-align: center; color: var(--muted); font-size: 14px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 15px; outline: none; transition: border-color 0.15s ease;
  }
  .field input:focus { border-color: var(--primary); }
  #room-code-input { letter-spacing: 4px; font-weight: 600; text-transform: uppercase; }
  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  button {
    cursor: pointer; border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
    padding: 12px 14px; transition: transform 0.05s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #create-room-btn { flex: 1; background: var(--primary); color: #fff; }
  #create-room-btn:hover:not(:disabled) { background: var(--primary-dark); }
  #join-room-btn { flex: 1; background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
  #join-room-btn:hover:not(:disabled) { background: #e2e8f0; }
  #lobby-error { margin-top: 14px; color: var(--error); font-size: 13px; text-align: center; min-height: 16px; }

  #map-screen { display: none; height: 100vh; width: 100vw; position: relative; }
  #map { height: 100%; width: 100%; }
  #top-banner {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(15, 23, 42, 0.92); color: #fff; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; font-size: 14px;
    backdrop-filter: blur(4px);
  }
  #top-banner .room-info { display: flex; align-items: center; gap: 10px; }
  #top-banner .room-code {
    font-weight: 700; letter-spacing: 3px; background: rgba(255, 255, 255, 0.12);
    padding: 4px 10px; border-radius: 6px;
  }
  #top-banner .participant-count { display: flex; align-items: center; gap: 6px; color: #cbd5e1; }
  #top-banner .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  #leave-room-btn { background: #ef4444; color: #fff; padding: 8px 14px; font-size: 13px; border-radius: 8px; }
  #leave-room-btn:hover { background: #dc2626; }
  #status-toast {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.9); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; z-index: 1000; display: none;
  }
  .user-marker-label {
    background: var(--primary); color: #fff; padding: 3px 8px; border-radius: 6px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); border: none;
  }
  .user-marker-label::before { display: none; }
  .self-marker-icon { background: #22c55e; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #22c55e; }
  .other-marker-icon { background: var(--primary); width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--primary); }
</style>
</head>
<body>

<div id="lobby-screen">
  <div class="lobby-card">
    <h1>📍 Live Location Share</h1>
    <p class="subtitle">Share your live location with a group, instantly.</p>

    <div class="field">
      <label for="user-name-input">Your Name</label>
      <input id="user-name-input" type="text" placeholder="e.g. Ashwin" maxlength="24" autocomplete="off" />
    </div>

    <div class="field">
      <label for="room-code-input">Room Code (to join)</label>
      <input id="room-code-input" type="text" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="off" />
    </div>

    <div class="btn-row">
      <button id="create-room-btn">Create Room</button>
      <button id="join-room-btn">Join Room</button>
    </div>

    <div id="lobby-error"></div>
  </div>
</div>

<div id="map-screen">
  <div id="top-banner">
    <div class="room-info">
      <span>Room:</span>
      <span class="room-code" id="banner-room-code">------</span>
      <span class="participant-count">
        <span class="dot"></span>
        <span id="banner-participant-count">1</span> online
      </span>
    </div>
    <button id="leave-room-btn">Leave</button>
  </div>

  <div id="map"></div>

  <div id="status-toast"></div>
</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin="">
</script>

<script src="/socket.io/socket.io.js"></script>

<script src="script.js"></script>
</body>
</html>
